name: Deploy GJJ Calculator

on:
  push:
    branches:
      - master
      - cursor/shenzhen-gjj-calculator-555e
    paths:
      - 'shenzhen-gjj-calculator/**'
      - '.github/workflows/deploy-gjj-calculator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-gjj-calculator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shenzhen-gjj-calculator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
